packages:
  - 'frontend'
  - 'packages/*'
  - 'e2e'
  - 'pdfgen'

# Alle pakker, også @navikt, hentes fra npmjs. Overstyrer lokal ~/.npmrc med @navikt:registry.
registries:
  default: https://registry.npmjs.org/
  '@navikt': https://registry.npmjs.org/

catalog:
  react: ^19.3.1
  react-dom: ^19.3.1
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@navikt/ds-react': ^8.23.0
  '@navikt/ds-css': ^8.23.0
  '@navikt/aksel-icons': ^8.23.0
  '@biomejs/biome': 2.6.8
  vitest: ^4.1.12
  typescript: ^5.9.3
  '@tanstack/react-query': ^5.108.1

allowBuilds:
  esbuild: true
minimumReleaseAge: 10080 # 10080 minutter = 7 dager
