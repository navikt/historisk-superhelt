services:
  pdfgen:
    build:
      context: .
      dockerfile: Dockerfile
    image: superhelt-pdfgen:latest
    ports:
      - "${PDFGEN_PORT:-8086}:8080"
    environment:
      DEV_MODE: "true"
    volumes:
      - ./data:/app/data:ro
    develop:
      watch:
        - path: ./templates
          target: /app/templates
          action: sync+restart
        - path: ./data
          target: /app/data
          action: sync+restart
        - path: ./fonts
          target: /app/fonts
          action: sync+restart
        - path: ./resources
          target: /app/resources
          action: sync+restart
