name: historisk-superhelt-sandkasse

services:
  postgres:
    image: postgres:18-alpine
    ports:
      - "127.0.0.1:${SANDBOX_POSTGRES_PORT:-15432}:5432"
    environment:
      POSTGRES_USER: ${SANDBOX_DB_USERNAME:-superhelt_sandkasse}
      POSTGRES_PASSWORD: ${SANDBOX_DB_PASSWORD:-sandkasse}
      POSTGRES_DB: historisk-superhelt-sandkasse
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  kafka:
    image: confluentinc/cp-kafka:8.2.0
    ports:
      - "127.0.0.1:${SANDBOX_KAFKA_PORT:-29092}:9093"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9093,CONTROLLER://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://${SANDBOX_KAFKA_ADVERTISED_HOST:-localhost}:${SANDBOX_KAFKA_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9094
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    tmpfs:
      - /var/lib/kafka/data:mode=1777
