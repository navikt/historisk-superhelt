name: Bygg og deploy main

on:
  push:
    branches:
      - main

concurrency:
  group: main-release
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build-and-test.yml
    secrets:
      READER_TOKEN: ${{ secrets.READER_TOKEN }}
    permissions:
      contents: read
      id-token: write
      checks: write
      pull-requests: write
  e2e:
    uses: ./.github/workflows/e2e.yaml
    secrets:
      READER_TOKEN: ${{ secrets.READER_TOKEN }}
    permissions:
      contents: read
      checks: write
      pull-requests: write
  deploy_dev:
    needs:
      - build
      - e2e
    name: "Deploy til dev"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-backend-dev
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Deploy backend til dev-gcp
        uses: nais/deploy/actions/deploy@9850be311389ca754d9a9f2280615419d738c891 #v3
        env:
          CLUSTER: dev-gcp
          RESOURCE: .nais/app/backend.yaml
          VARS: .nais/dev.json
          IMAGE: ${{ needs.build.outputs.image }}
          TELEMETRY: ${{ needs.build.outputs.telemetry }}
  deploy_prod:
    needs:
      - build
      - deploy_dev
    name: "Deploy til prod"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Deploy backend til prod-gcp
        uses: nais/deploy/actions/deploy@9850be311389ca754d9a9f2280615419d738c891 #v3
        env:
          CLUSTER: prod-gcp
          RESOURCE: .nais/app/backend.yaml
          VARS: .nais/prod.json
          IMAGE: ${{ needs.build.outputs.image }}
          TELEMETRY: ${{ needs.build.outputs.telemetry }}
