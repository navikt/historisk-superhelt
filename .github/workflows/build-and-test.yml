name: Bygg, test og pakk image
on:
  workflow_call:
    inputs:
      publish-image:
        type: boolean
        default: true
        description: 'Publiser image til GAR'
    secrets:
      READER_TOKEN:
        required: true
        description: 'Token for npm-registry'
    outputs:
      image:
        description: 'Docker image '
        value: ${{ jobs.build.outputs.image }}
      telemetry:
        description: 'Telemetry data'
        value: ${{ jobs.build.outputs.telemetry }}

jobs:
  frontend:
    name: Sjekk frontend (${{ matrix.check }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: biome
            command: pnpm --filter super-frontend run biome
          - check: test
            command: pnpm run test --reporter=default --reporter=junit --outputFile=test-results/junit.xml
            report-name: Tester (Vitest)
            report-path: '**/test-results/junit.xml'
          - check: test:browser
            command: pnpm run test:browser --reporter=default --reporter=junit --outputFile=test-results/browser-junit.xml
            report-name: Browser (Vitest Chromium)
            report-path: '**/test-results/browser-junit.xml'
          - check: typecheck
            command: pnpm --filter super-frontend run typecheck
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Installer avhengigheter
        run: pnpm install --frozen-lockfile

      - name: Setup Playwright
        if: matrix.check == 'test:browser'
        uses: ./.github/actions/setup-playwright
        with:
          only-shell: 'true'

      - name: ${{ matrix.check }}
        id: frontend-check
        env:
          CI: true
        run: ${{ matrix.command }}

      - name: Rapporter testresultater
        if: >-
          always() && matrix.report-path != '' &&
          (github.event_name != 'pull_request' ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          github.actor != 'dependabot[bot]'))
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
        with:
          check_name: ${{ matrix.report-name }}
          report_paths: ${{ matrix.report-path }}
          comment: ${{ github.event_name == 'pull_request' }}

  build:
    name: "Bygg backend"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Arver callerens tilganger, inkludert OIDC bare ved image-publisering.
    outputs:
      image: ${{ steps.docker-build-push.outputs.image }}
      telemetry: ${{ steps.docker-build-push.outputs.telemetry }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Build artifacts
        id: maven
        run: mvn --batch-mode clean verify

      - name: Rapporter Maven-tester
        if: >-
          always() &&
          (github.event_name != 'pull_request' ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          github.actor != 'dependabot[bot]'))
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
        with:
          check_name: Backend og libs (Maven)
          report_paths: |
            **/target/surefire-reports/TEST-*.xml
            **/target/failsafe-reports/TEST-*.xml
          comment: ${{ github.event_name == 'pull_request' }}

      - name: Last opp Maven-testresultater
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: maven-test-results
          path: |
            **/target/surefire-reports/TEST-*.xml
            **/target/failsafe-reports/TEST-*.xml
          if-no-files-found: warn
          retention-days: 3

      - name: Bygg Docker-image uten publisering
        if: ${{ !inputs.publish-image }}
        run: docker build --tag superhelt:pr ./backend

      - name: Bygg og push docker image til GAR
        if: inputs.publish-image
        uses: nais/docker-build-push@dd7421d5068057a020ca46ead966c26190c516b1 #v0
        id: docker-build-push
        with:
          team: historisk
          docker_context: ./backend
