name: Bygg, test og deploy pdfgen

on:
  push:
    branches:
      - main
    paths:
      - 'pdfgen/**'
      - '.nais/app/pdfgen.yaml'
      - '.github/workflows/pdfgen.yml'
      - '.nais/dev.json'
      - '.nais/prod.json'
  pull_request:
    paths:
      - 'pdfgen/**'
      - '.github/workflows/pdfgen.yml'

concurrency:
  group: pdfgen-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: "Test pdfgen"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Installer avhengigheter
        run: pnpm install --frozen-lockfile

      - name: Kjør lokale tester
        working-directory: ./pdfgen
        run: pnpm test --reporter=default --reporter=junit --outputFile=test-results/unit.xml

      - name: Start pdfgen
        run: docker compose -f pdfgen/compose.yml up --build -d --wait

      - name: Vent på pdfgen
        run: >-
          curl --fail --silent --show-error --output /dev/null
          --retry 30 --retry-connrefused --retry-delay 2 --retry-max-time 120 --max-time 10
          http://localhost:8086/internal/is_alive

      - name: Kjør integrasjonstester
        working-directory: ./pdfgen
        run: pnpm test:integration --reporter=default --reporter=junit --outputFile=test-results/integration.xml

      - name: Rapporter pdfgen-tester
        if: >-
          always() &&
          (github.event_name != 'pull_request' ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          github.actor != 'dependabot[bot]'))
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
        with:
          check_name: Pdfgen (Vitest)
          report_paths: pdfgen/test-results/*.xml
          comment: ${{ github.event_name == 'pull_request' }}

      - name: Last opp testresultater
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pdfgen-test-results
          path: pdfgen/test-results/
          retention-days: 3

      - name: Vis pdfgen-logger ved feil
        if: failure()
        run: docker compose -f pdfgen/compose.yml logs

      - name: Stopp pdfgen
        if: always()
        run: docker compose -f pdfgen/compose.yml down

  build:
    needs: [test]
    if: github.event_name == 'push'
    name: "Bygg pdfgen"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.docker-build-push.outputs.image }}
      telemetry: ${{ steps.docker-build-push.outputs.telemetry }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bygg og push docker image til GAR
        uses: nais/docker-build-push@dd7421d5068057a020ca46ead966c26190c516b1 #v0
        id: docker-build-push
        with:
          team: historisk
          docker_context: ./pdfgen

  deploy_dev:
    needs: [build]
    name: "Deploy til dev"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Deploy pdfgen til dev-gcp
        uses: nais/deploy/actions/deploy@6a9dcd6df697ec2d38edc78cadb0b9acd1232f50 #v3
        env:
          CLUSTER: dev-gcp
          RESOURCE: .nais/app/pdfgen.yaml
          VARS: .nais/dev.json
          IMAGE: ${{ needs.build.outputs.image }}
          TELEMETRY: ${{ needs.build.outputs.telemetry }}

  deploy_prod:
    needs: [build, deploy_dev]
    name: "Deploy til prod"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Deploy pdfgen til prod-gcp
        uses: nais/deploy/actions/deploy@6a9dcd6df697ec2d38edc78cadb0b9acd1232f50 #v3
        env:
          CLUSTER: prod-gcp
          RESOURCE: .nais/app/pdfgen.yaml
          VARS: .nais/prod.json
          IMAGE: ${{ needs.build.outputs.image }}
          TELEMETRY: ${{ needs.build.outputs.telemetry }}
