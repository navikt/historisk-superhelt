name: Bygg og deploy pdfgen

on:
  push:
    branches:
      - main
    paths:
      - 'pdfgen/**'
      - '.nais/app/pdfgen.yaml'
      - '.github/workflows/pdfgen.yml'
      - '.nais/dev.json'
      - '.nais/prod.json'

concurrency:
  group: pdfgen-release
  cancel-in-progress: false

jobs:
  build:
    name: "Bygg pdfgen"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.docker-build-push.outputs.image }}
      telemetry: ${{ steps.docker-build-push.outputs.telemetry }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bygg og push docker image til GAR
        uses: nais/docker-build-push@423a915c9b72edf2ba848b88171ccb0489e2a40a #v0
        id: docker-build-push
        with:
          team: historisk
          docker_context: ./pdfgen

  deploy_dev:
    needs: [build]
    name: "Deploy til dev"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Deploy pdfgen til dev-gcp
        uses: nais/deploy/actions/deploy@7ad7c2b833e1db74a80954e3ee6bb6ac060a8ae7 #v2
        env:
          CLUSTER: dev-gcp
          RESOURCE: .nais/app/pdfgen.yaml
          VARS: .nais/dev.json
          IMAGE: ${{ needs.build.outputs.image }}
          TELEMETRY: ${{ needs.build.outputs.telemetry }}

  deploy_prod:
    needs: [build, deploy_dev]
    name: "Deploy til prod"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Deploy pdfgen til prod-gcp
        uses: nais/deploy/actions/deploy@7ad7c2b833e1db74a80954e3ee6bb6ac060a8ae7 #v2
        env:
          CLUSTER: prod-gcp
          RESOURCE: .nais/app/pdfgen.yaml
          VARS: .nais/prod.json
          IMAGE: ${{ needs.build.outputs.image }}
          TELEMETRY: ${{ needs.build.outputs.telemetry }}
