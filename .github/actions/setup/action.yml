name: 'Setup'
description: 'Sett opp Java, Node, pnpm og dependency-cache'
    
runs:
  using: 'composite'
  steps:
    - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: temurin
        java-version: '25'
        cache: maven

    - uses: pnpm/setup@v3
      with:
        registry: "https://npm.pkg.github.com"
        cache: true
